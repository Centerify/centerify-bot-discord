@main
@title Channel management
@color Blurple
Manage {channel.mention}. These actions require View Channel and Manage Channels for you and the bot.
@button primary [Rename](SetChannelName("{channel.id}", "community-chat"))
@button secondary [Update topic](SetChannelTopic("{channel.id}", "Welcome to {guild.name}!"))
@select Channel settings
@option [Slowmode: 10 seconds](SetSlowmode("{channel.id}", 10))
@option [Disable slowmode](SetSlowmode("{channel.id}", 0))
@option [Clear topic](SetChannelTopic("{channel.id}", ""))
@option [Remove category](SetChannelCategory("{channel.id}", null))
@endselect
