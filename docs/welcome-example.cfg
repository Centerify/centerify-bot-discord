@var USER_ID = {user.id}
@var GREETING = Hello {user.mention}!

@main
@title Welcome to {guild.name}!
@color Blurple
@thumbnail {user.avatar}
{GREETING}
Choose an option below.

@dropdown Choose an option
@option [Server rules](Go(stage(1)))
@option [Show my user ID](Reply("Your user ID is {USER_ID}"))
@endselect

@button danger [Close](Cancel)

@stage(1)
@title Server Rules
@color #ed4245
1. Be respectful.
2. No spam or advertising.
3. Keep discussions in the right channels.

@button secondary [Back](Back(stage(0)))
@button danger [Close](Cancel)
