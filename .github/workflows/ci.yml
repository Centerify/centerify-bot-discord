name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: centerify
          POSTGRES_PASSWORD: centerify
          POSTGRES_DB: centerify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U centerify -d centerify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting and lint
        run: npm run format:check && npm run lint

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dashboard types and production build
        run: npm run dashboard:typecheck && npm run dashboard:build
        env:
          CENTERIFY_DASHBOARD_STANDALONE: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dashboard HTTP smoke
        run: |
          npm --prefix dashboard run start -- --port 3001 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3001/api/health && break; sleep 1; done
          node scripts/test-dashboard.mjs
        env:
          AUTH_URL: http://localhost:3001
          AUTH_SECRET: local-ci-only-dashboard-session-secret-not-a-real-credential
          CENTERIFY_DASHBOARD_DEMO: "true"

      - name: Apply migrations to the test database
        run: npx prisma db migrate
        env:
          DATABASE_URL: postgresql://centerify:centerify@localhost:5432/centerify_test

      - name: Test PostgreSQL and custom-command workflows
        run: npm run test:database
        env:
          TEST_DATABASE_URL: postgresql://centerify:centerify@localhost:5432/centerify_test

  windows:
    name: Windows portability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test production Compose services
        run: sh scripts/test-containers.sh
