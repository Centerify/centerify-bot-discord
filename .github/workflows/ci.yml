name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: centerify
          POSTGRES_PASSWORD: centerify
          POSTGRES_DB: centerify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U centerify -d centerify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting and lint
        run: npm run format:check && npm run lint

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply migrations to the test database
        run: npx prisma db migrate
        env:
          DATABASE_URL: postgresql://centerify:centerify@localhost:5432/centerify_test

      - name: Test PostgreSQL and custom-command workflows
        run: npm run test:database
        env:
          TEST_DATABASE_URL: postgresql://centerify:centerify@localhost:5432/centerify_test

  windows:
    name: Windows portability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime --tag centerify:test .
