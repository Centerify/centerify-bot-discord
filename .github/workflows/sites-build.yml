name: Build Sites dashboard

on:
  workflow_dispatch:
  push:
    branches: [codex/sites-deployment]
    paths:
      - dashboard/**
      - src/**
      - deploy/sites/**
      - scripts/prepare-sites.mjs
      - scripts/test-dashboard.mjs
      - .github/workflows/sites-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CENTERIFY_DASHBOARD_DEMO: "true"
      AUTH_URL: http://127.0.0.1:5173
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare latest dashboard sources
        run: node scripts/prepare-sites.mjs
      - name: Install build dependencies in the cloud
        working-directory: .sites-build/centerify
        run: npm install --no-audit --no-fund
      - name: Build Cloudflare Worker
        working-directory: .sites-build/centerify
        run: npm run build
      - name: Verify the built demo
        working-directory: .sites-build/centerify
        shell: bash
        run: |
          npm start -- --port 5173 \
            --var CENTERIFY_DASHBOARD_DEMO:true \
            --var AUTH_URL:http://127.0.0.1:5173 \
            --var AUTH_SECRET:isolated-cloud-build-demo-only-secret \
            > /tmp/centerify-sites-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/centerify-sites-preview.log
            exit 1
          fi
          DASHBOARD_TEST_URL=http://127.0.0.1:5173 node scripts/test-centerify-demo.mjs
      - name: Upload Worker build and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: centerify-sites-worker-${{ github.sha }}
          path: |
            .sites-build/centerify/dist/
            .sites-build/centerify/package-lock.json
            .sites-build/centerify/.openai/hosting.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
