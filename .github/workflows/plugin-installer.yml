name: Native plugin installer

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Test installer on its native operating system
        working-directory: tools/plugin-marketplace
        run: go test -v ./...
      - name: Build and smoke-test native executable
        working-directory: tools/plugin-marketplace
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o installer .
          ./installer version
          ./installer --root ../.. marketplace

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Cross-compile dependency-free binaries
        working-directory: tools/plugin-marketplace
        run: go run build.go
      - uses: actions/upload-artifact@v4
        with:
          name: centerify-plugin-installer
          path: artifacts/plugin-installer/
